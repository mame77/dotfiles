# default
set -g prefix C-f
set -g base-index 1
set -g mode-keys vi
set -g default-terminal "xterm-ghostty"
set -as terminal-overrides ",xterm-256color:RGB"
# display
set -g status-position top
set -g status-justify centre
set -g status-right ''
set -g status-left ''
set -g status-left-length 20
set -g pane-active-border-style "fg=blue"
set -g status-style "bg=default"
set -g window-status-style "bg=default,fg=colour250"
set -g window-status-current-style "bg=default,fg=cyan"
# keymap
bind h if -F '#{pane_at_left}' '' 'select-pane -L'
bind l if -F '#{pane_at_right}' '' 'select-pane -R'
bind H resize-pane -L 5
bind L resize-pane -R 5
bind k copy-mode

bind u split-window -h -l 50% -c "#{pane_current_path}"
bind i split-window -h -l 35% -c "#{pane_current_path}"

bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

